<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="brand.css">
<style>
  html, body { background: transparent; }
  .box { width: 100vw; height: 100vh; display: grid; place-items: center; }
  .icon { width: 100%; height: 100%; }
  .mark, .line { width: 78%; height: 78%; }
  /* Avatar: full-bleed square so Patreon/Discord can crop it to a circle. */
  .avatar { background: var(--gradient); }
  .avatar span { width: 84%; height: 84%; transform: translateY(3%); }
  .deer { width: 92%; height: 92%; }
</style>
</head>
<body>
<div class="box" id="box"></div>
<script>
  const q = new URLSearchParams(location.search);
  const v = q.get('v');
  const color = '#' + (q.get('c') || 'fff');
  const box = document.getElementById('box');
  if (v === 'avatar') {
    box.classList.add('avatar');
    box.innerHTML = '<span data-deer="deer"></span>';
  } else {
    box.innerHTML = `<span class="${v}" data-deer="${v}" style="color:${color}"></span>`;
  }
</script>
<script src="deer.js"></script>
</body>
</html>
